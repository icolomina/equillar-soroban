[workspace]
resolver = "2"
members = [
  "contracts/*",
]

[workspace.dependencies]
soroban-sdk = "28.0.0"
stellar-contract-utils = { git = "https://github.com/OpenZeppelin/stellar-contracts", rev = "37101634b868cdf65676b125ddfb72ada82d4592" }
stellar-access = { git = "https://github.com/OpenZeppelin/stellar-contracts", rev = "37101634b868cdf65676b125ddfb72ada82d4592" }
stellar-macros = { git = "https://github.com/OpenZeppelin/stellar-contracts", rev = "37101634b868cdf65676b125ddfb72ada82d4592" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
